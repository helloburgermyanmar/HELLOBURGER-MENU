<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Burger | Menu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        @font-face {
            font-family: 'JtGilboys';
            src: url('Jt Gilboys_2.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --brand-orange: #FF6600;
            --brand-yellow: #FFD400;
            --brand-black: #222222;
            --brand-white: #FFFFFF;
            --bg-light: #FFF9F5;
            --border-width: 3px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'JtGilboys', sans-serif;
            background-color: var(--bg-light);
            color: var(--brand-black);
            line-height: 1.6;
            padding-bottom: 80px;
        }

        h1, h2, h3, .brand-font {
            font-family: 'JtGilboys', sans-serif;
        }

        .header {
            background-color: var(--brand-orange);
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: var(--border-width) solid var(--brand-black);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-logo {
            max-height: 50px;
            width: auto;
        }

        .promo-slider-container {
            width: 100%;
            position: relative;
            overflow: hidden;
            border-bottom: var(--border-width) solid var(--brand-black);
            background-color: var(--brand-black);
        }

        .promo-slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .promo-slider::-webkit-scrollbar {
            display: none;
        }

        .promo-slide {
            flex: 0 0 100%;
            height: 200px;
            scroll-snap-align: center;
            position: relative;
        }

        .promo-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .main-content {
            max-width: 600px;
            margin: 0 auto;
            padding: 0;
        }

        .categories-wrapper {
            background-color: var(--brand-white);
            border-bottom: var(--border-width) solid var(--brand-black);
            padding: 15px;
            position: sticky;
            top: 90px;
            z-index: 99;
        }

        .categories-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            font-family: 'JtGilboys', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--brand-black);
            background-color: var(--brand-white);
            border: 2px solid var(--brand-black);
            border-radius: 25px;
            padding: 8px 20px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0 var(--brand-black);
        }

        .category-btn.active {
            background-color: var(--brand-orange);
            color: var(--brand-white);
            box-shadow: inset 2px 2px 0 rgba(0,0,0,0.2);
            transform: translate(2px, 2px);
        }
        
        .category-title {
            padding: 20px 15px 10px;
            font-size: 22px;
            color: var(--brand-black);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .category-title::before {
            content: '';
            display: block;
            width: 12px;
            height: 12px;
            background-color: var(--brand-yellow);
            border: 2px solid var(--brand-black);
            border-radius: 50%;
        }

        .menu-list {
            padding: 0 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-item {
            display: flex;
            background: var(--brand-white);
            border: var(--border-width) solid var(--brand-black);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 4px 4px 0 var(--brand-black);
            transition: transform 0.1s ease;
            cursor: pointer;
        }

        .menu-item:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--brand-black);
        }

        .item-image {
            width: 120px;
            min-width: 120px;
            height: 120px;
            object-fit: cover;
            border-right: var(--border-width) solid var(--brand-black);
        }

        .item-details {
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .item-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--brand-black);
            line-height: 1.2;
            margin-bottom: 5px;
        }
        
        .item-desc {
            font-family: 'Nunito', sans-serif; /* ဒီစာကြောင်းလေး ထပ်ပေါင်းထည့်လိုက်ပါတယ် */
            font-size: 12px;
            color: #555;
            line-height: 1.3;
            margin-bottom: auto;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .item-price {
            font-family: 'JtGilboys', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--brand-orange);
        }

        .add-btn {
            background-color: var(--brand-white);
            border: none;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 0;
            border-radius: 50%;
            overflow: hidden;
        }

        .add-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .extras-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 0 15px 20px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .extras-container::-webkit-scrollbar {
            display: none;
        }

        .extra-box {
            min-width: 100px;
            flex: 0 0 auto;
            background: var(--brand-white);
            border: var(--border-width) solid var(--brand-black);
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: 4px 4px 0 var(--brand-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .extra-box:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--brand-black);
        }

        .extra-box img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid var(--brand-black);
        }

        .extra-name { 
            font-weight: 800; 
            font-size: 14px; 
            color: var(--brand-black);
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .extra-price { 
            color: var(--brand-orange); 
            font-size: 14px; 
            font-weight: 700; 
            font-family: 'JtGilboys', sans-serif; 
        }

        .contact-section {
            padding: 40px 20px;
            text-align: center;
        }

        .mascot-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .mascot-image {
            height: 150px;
            width: auto;
            object-fit: contain;
        }

        .contact-title {
            font-size: 24px;
            color: var(--brand-black);
            margin-bottom: 25px;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .social-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: var(--brand-white);
            border: var(--border-width) solid var(--brand-black);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--brand-black);
            font-size: 32px;
            text-decoration: none;
            box-shadow: 4px 4px 0 var(--brand-black);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .social-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--brand-black);
        }

        .social-btn.facebook { color: #1877F2; }
        .social-btn.tiktok { color: #000000; }
        .social-btn.instagram { color: #E4405F; }
        .social-btn.phone { color: #128C7E; } 

    </style>
</head>
<body>

    <header class="header">
        <img src="logo.png" alt="Hello Burger Logo" class="header-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <h1 class="brand-font" style="color: var(--brand-white); display: none;">HELLO BURGER</h1>
    </header>

    <div class="promo-slider-container">
        <div class="promo-slider" id="promo-slider">
        </div>
    </div>

    <main class="main-content">
        
        <div class="categories-wrapper">
            <div class="categories-container" id="category-tabs">
            </div>
        </div>

        <div id="menu-container">
        </div>

        <div class="contact-section">
            <div class="mascot-container">
                <img src="mascot.png" alt="Hello Burger Mascot" class="mascot-image" onerror="this.src='https://placehold.co/120x120/FF6600/FFFFFF?text=Mascot'">
            </div>

            <h2 class="contact-title brand-font">Contact Us</h2>
            <div class="social-links">
                <a href="tel:+959968885291" class="social-btn phone" title="Call Us">
                    <i class="fas fa-phone"></i>
                </a>
                <a href="https://www.facebook.com/profile.php?id=100069918460934" class="social-btn facebook" target="_blank" title="Facebook Page">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://www.tiktok.com/@helloburgermyanmar" class="social-btn tiktok" target="_blank" title="TikTok">
                    <i class="fab fa-tiktok"></i>
                </a>
                <a href="https://www.instagram.com/helloburger_myanmar/?hl=en" class="social-btn instagram" target="_blank" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>
        </div>

    </main>

    <script>
        const promoData = [
            "promo1.webp",
            "promo2.webp"
        ];

        const menuData = [
            {
                category: "BURGERS", 
                items: [
                    { 
                        name: "CRISPY CHICKEN BURGER", 
                        desc: "Made with 100% real chicken, crispy chicken, and our Signature Mayo.", 
                        price: "6,000 MMK", 
                        image: "burger1.webp" 
                    },
                    { 
                        name: "CHEESE CHICKEN BURGER", 
                        desc: "A tasty combination of chicken, premium cheese, and mayo.", 
                        price: "7,000 MMK", 
                        image: "burger2.webp" 
                    },
                    { 
                        name: "CHEESE BEEF BURGER", 
                        desc: "Made with fresh, real beef a perfect choice for beef lovers.", 
                        price: "7,000 MMK", 
                        image: "burger3.webp" 
                    },
                    { 
                        name: "CHEESE BACON BURGER", 
                        desc: "Grilled premium bacon combined with a juicy beef patty.", 
                        price: "8,500 MMK", 
                        image: "burger4.webp" 
                    },
                    { 
                        name: "CHEESE PORK BURGER", 
                        desc: "A flavorful pork patty burger with a rich but not too heavy taste.", 
                        price: "7,500 MMK", 
                        image: "burger5.webp" 
                    },
                    { 
                        name: "SMASH BURGER", 
                        desc: "A juicy patty with Signature Mayo and fresh vegetables.", 
                        price: "7,500 MMK", 
                        image: "burger6.webp" 
                    },
                    { 
                        name: "DOUBLE BEEF BURGER", 
                        desc: "Made with two juicy patties a perfect choice for burger lovers.", 
                        price: "9,500 MMK", 
                        image: "burger7.webp" 
                    },
                    { 
                        name: "CHARCOLA BURGER", 
                        desc: "Made with a soft and fluffy bun for a different burger experience.", 
                        price: "7,000 MMK", 
                        image: "burger8.webp" 
                    },
                    { 
                        name: "BBQ CHICKEN BURGER", 
                        desc: "Grilled chicken patty with Signature Mayo and a spicy BBQ flavor.", 
                        price: "7,000 MMK", 
                        image: "burger9.webp" 
                    },
                    { 
                        name: "CHICKEN SANDWICH", 
                        desc: "A simple chicken sandwich made with soft and fluffy bread.", 
                        price: "8,500 MMK", 
                        image: "burger10.webp" 
                    },
                    { 
                        name: "BACON HOTDOG", 
                        desc: "A great choice for bacon lovers.", 
                        price: "7,500 MMK", 
                        image: "burger11.webp" 
                    },
                    { 
                        name: "SAUSAGE HOTDOG", 
                        desc: "ကA satisfying hot dog made for sausage lovers.", 
                        price: "7,500 MMK", 
                        image: "burger12.webp" 
                    }
                ]
            },
            {
                category: "EXTEAS",
                layout: "horizontal", 
                items: [
                    { name: "EGG", price: "+1,000 MMK", image: "extra1.webp" },
                    { name: "BACON", price: "+1,000 MMK", image: "extra2.webp" },
                    { name: "MAYO", price: "+1,000 MMK", image: "extra3.webp" },
                    { name: "CHEESE", price: "+1,000 MMK", image: "extra4.webp" }
                ]
            },
            {
                category: "SIDES", 
                items: [
                    { name: "FRENCH FRIES", desc: "A perfect side choice for your burger.", price: "3,000 MMK", image: "side1.webp" },
                    { name: "CHICKEN STRIPS × 2PCS", desc: "Delicious chicken strips. Comes with free Signature Mayo.", price: "5,500 MMK", image: "side2.webp" },
                    { name: "CHICKEN STRIPS × 4PCS", desc: "Perfect for sharing. Crispy chicken strips with free mayo.", price: "8,000 MMK", image: "side3.webp" },
                    { name: "POP CHICKEN", desc: "Crispy boneless chicken. Available in Original, Malar, and Korean flavors.", price: "6,000 MMK", image: "side4.webp" }
                ]
            },
            {
                category: "DRINKS", 
                items: [
                    { name: "COCA COLA", desc: "အThe perfect refreshing drink to enjoy with your favorite burger.", price: "3,000 MMK", image: "drink1.webp" },
                    { name: "LEMON TEA", desc: "Made with fresh, real lemons for a perfectly refreshing drink.", price: "4,000 MMK", image: "drink2.webp" },
                    { name: "SPRITE", desc: "Cool, fizzy, and perfectly refreshing.", price: "3,000 MMK", image: "drink3.webp" },
                    { name: "MAX+", desc: "A sweet and refreshing fizzy drink to quench your thirst.", price: "3,000 MMK", image: "drink4.webp" }
                ]
            },
            {
                category: "COMBO SET",
                items: [
                    { 
                        name: "COMB0 1", 
                        desc: "Cheese Chicken Burger (1) + French Fries (1) + Coca-Cola (1)", 
                        originalPrice: "13,000 MMK",
                        price: "12,500 MMK", 
                        image: "combo1.webp" 
                    },
                    { 
                        name: "COMBO 2", 
                        desc: "Cheese Beef Burger (1) + Sausage Hotdog (1) + Coca-Cola (1)", 
                        originalPrice: "15,000 MMK",
                        price: "14,000 MMK", 
                        image: "combo2.webp" 
                    },
                    { 
                        name: "COMBO 3", 
                        desc: "Cheese Chicken Burger (1) + Cheese Beef Burger (1) + Chicken Strips (2) + French Fries (1) + Coca-Cola (2)", 
                        originalPrice: "28,500 MMK",
                        price: "27,000 MMK", 
                        image: "combo3.webp" 
                    },
                    { 
                        name: "COMBO 4", 
                        desc: "Cheese Chicken Burger (1) + Chicken Sandwich (1) + Sausage Hotdog (1) + French Fries (1) + Coca-Cola (1)", 
                        originalPrice: "22,000 MMK",
                        price: "21,000 MMK", 
                        image: "combo4.webp" 
                    }
                ]
            }
        ];

        const categoryTabsContainer = document.getElementById('category-tabs');
        const menuContainer = document.getElementById('menu-container');
        const promoSliderContainer = document.getElementById('promo-slider');

        function renderPromos() {
            promoData.forEach(imgUrl => {
                const slide = document.createElement('div');
                slide.className = 'promo-slide';
                slide.innerHTML = `<img src="${imgUrl}" alt="Promotion" loading="lazy">`;
                promoSliderContainer.appendChild(slide);
            });

            if (promoData.length > 1) {
                let currentSlide = 0;
                setInterval(() => {
                    currentSlide = (currentSlide + 1) % promoData.length;
                    promoSliderContainer.scrollTo({
                        left: currentSlide * promoSliderContainer.offsetWidth,
                        behavior: 'smooth'
                    });
                }, 3000);
            }
        }

        function renderMenu() {
            menuData.forEach((section, index) => {
                const tab = document.createElement('button');
                tab.className = `category-btn ${index === 0 ? 'active' : ''}`;
                tab.textContent = section.category;
                
                tab.onclick = () => {
                    document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
                    tab.classList.add('active');
                    
                    const targetSection = document.getElementById(`section-${section.category}`);
                    const yOffset = -140; 
                    const y = targetSection.getBoundingClientRect().top + window.pageYOffset + yOffset;
                    window.scrollTo({top: y, behavior: 'smooth'});
                };
                categoryTabsContainer.appendChild(tab);

                const sectionDiv = document.createElement('div');
                sectionDiv.id = `section-${section.category}`;
                
                const sectionTitle = document.createElement('h2');
                sectionTitle.className = 'category-title brand-font';
                sectionTitle.textContent = section.category;
                sectionDiv.appendChild(sectionTitle);

                if (section.layout === 'horizontal') {
                    const hListDiv = document.createElement('div');
                    hListDiv.className = 'extras-container';
                    
                    section.items.forEach(item => {
                        const box = document.createElement('div');
                        box.className = 'extra-box';
                        box.innerHTML = `
                            <img src="${item.image}" alt="${item.name}" loading="lazy">
                            <span class="extra-name">${item.name}</span>
                            <span class="extra-price">${item.price}</span>
                        `;
                        hListDiv.appendChild(box);
                    });
                    
                    sectionDiv.appendChild(hListDiv);
                } else {
                    const listDiv = document.createElement('div');
                    listDiv.className = 'menu-list';

                    section.items.forEach(item => {
                        const itemCard = document.createElement('div');
                        itemCard.className = 'menu-item';
                        
                        // Handle price display (check if originalPrice exists)
                        const priceDisplay = item.originalPrice 
                            ? `<div style="display: flex; flex-direction: column;">
                                   <span style="text-decoration: line-through; color: #888; font-size: 13px; line-height: 1; margin-bottom: 2px;">${item.originalPrice}</span>
                                   <span class="item-price">${item.price}</span>
                               </div>`
                            : `<span class="item-price">${item.price}</span>`;

                        itemCard.innerHTML = `
                            <img src="${item.image}" alt="${item.name}" class="item-image" loading="lazy">
                            <div class="item-details">
                                <div>
                                    <h3 class="item-name brand-font">${item.name}</h3>
                                    <p class="item-desc">${item.desc}</p>
                                </div>
                                <div class="item-bottom">
                                    ${priceDisplay}
                                    <button class="add-btn">
                                        <img src="icon-logo.png" alt="Add" onerror="this.src='https://placehold.co/30x30/FFD400/000000?text=+'">
                                    </button>
                                </div>
                            </div>
                        `;
                        listDiv.appendChild(itemCard);
                    });

                    sectionDiv.appendChild(listDiv);
                }

                menuContainer.appendChild(sectionDiv);
            });
        }

        renderPromos();
        renderMenu();

        window.addEventListener('scroll', () => {
            let current = '';
            const sections = document.querySelectorAll('#menu-container > div');
            
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (pageYOffset >= sectionTop - 160) {
                    current = section.getAttribute('id').replace('section-', '');
                }
            });

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === current) {
                    btn.classList.add('active');
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            });
        });

    </script>
</body>
</html>
